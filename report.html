<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深度省钱报告 · AI 成本优化手册</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--bd:#30363d;--tx:#e6edf3;--mut:#8b949e;--ac:#2f81f7;--gr:#3fb950;--or:#d29922;--rd:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;padding:20px;max-width:860px;margin:0 auto}
h1{font-size:1.6em;margin-bottom:4px}h2{font-size:1.2em;margin:22px 0 10px;color:var(--ac);border-left:3px solid var(--ac);padding-left:10px}
.sub{color:var(--mut);font-size:.9em;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:14px}
label{display:block;font-size:.83em;color:var(--mut);margin-bottom:4px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}.row>div{flex:1;min-width:130px}
input,select{width:100%;background:#0d1117;border:1px solid var(--bd);color:var(--tx);border-radius:7px;padding:10px;font-size:1em}
.btn{background:var(--ac);color:#fff;border:none;border-radius:8px;padding:12px;font-size:1em;cursor:pointer;width:100%;font-weight:600;margin-top:6px}
.btn2{background:#21262d;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:10px 18px;cursor:pointer;font-size:.9em}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.88em}
th,td{padding:8px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mut);font-weight:500}
.good{color:var(--gr);font-weight:700}.warn{color:var(--or)}
.big{font-size:1.9em;font-weight:800;color:var(--gr)}
ol,ul{margin:8px 0 8px 20px}li{margin:5px 0}
.lock{text-align:center;padding:36px 20px}
.hide{display:none}
.tag{display:inline-block;background:#1f6feb33;color:var(--ac);border-radius:5px;padding:1px 8px;font-size:.78em;margin-left:6px}
.foot{color:var(--mut);font-size:.76em;text-align:center;margin-top:20px}
@media print{body{max-width:100%}.noprint{display:none}}
</style>
</head>
<body>
<h1>🧾 深度省钱报告</h1>
<div class="sub">输入你的真实用量 → 生成个性化 AI 成本优化手册（成本画像 / 路由方案 / 12月预测 / 迁移清单）。数据源：sub2api 真实网关价。</div>

<div id="paywall" class="card lock">
<div style="font-size:2.4em">🔒</div>
<h2 style="border:none;text-align:center">完整报告 ¥9 解锁</h2>
<p style="color:var(--mut);margin:10px 0 16px">基础对比永久免费；<b style="color:var(--or)">¥9 深度省钱报告</b>含：成本画像 · 分场景路由方案 · 5条节省策略(带预估) · 12个月预测 · 迁移清单 · 中文生态选型表。</p>
<div style="max-width:300px;margin:0 auto">
<img src="pay-wechat.jpg" alt="微信支付" style="width:100%;border-radius:10px;border:1px solid var(--bd)">
<p style="color:var(--mut);font-size:.82em;margin:8px 0">微信扫码支付 ¥9</p>
<button class="btn" onclick="paid()">✅ 我已付款，显示口令</button>
<div id="codereveal" class="hide" style="margin-top:14px;background:#1c2128;border:1px dashed var(--bd);border-radius:8px;padding:12px">
口令：<b id="codeval" style="color:var(--gr)">SAVER-ZH-2026</b>
<br><button class="btn2" style="margin-top:8px" onclick="document.getElementById('code').value=document.getElementById('codeval').textContent;unlock()">填入并解锁</button>
</div>
<label style="margin-top:16px">已有口令？直接输入</label>
<input id="code" placeholder="如 SAVER-ZH-2026" onkeydown="if(event.key==='Enter')unlock()">
<button class="btn2" style="margin-top:6px;width:100%" onclick="unlock()">解锁报告</button>
<button class="btn2 noprint" style="margin-top:10px;width:100%" onclick="previewMode()">先看免费预览</button>
</div>
</div>

<div id="app" class="hide">
<div class="card noprint">
<div class="row">
<div><label>月输入 tokens（百万）</label><input id="in" type="number" value="5" step="0.1"></div>
<div><label>月输出 tokens（百万）</label><input id="out" type="number" value="1" step="0.1"></div>
</div>
<div class="row">
<div><label>当前模型（对比基准）</label><select id="base">
<option value="210,420">GPT-4 ($30/$60)</option>
<option value="105,525">Claude Opus ($15/$75)</option>
<option value="35,105" selected>GPT-4o ($5/$15)</option>
<option value="21,105">Claude Sonnet ($3/$15)</option></select></div>
<div><label>主要用途</label><select id="use">
<option value="write">写文/内容</option><option value="agent" selected>Agent/工具调用</option>
<option value="long">长文/文档</option><option value="chat">客服/对话</option></select></div>
</div>
<button class="btn" onclick="render()">生成我的深度报告</button>
<button class="btn2" style="margin-top:8px" onclick="window.print()">🖨️ 打印 / 存 PDF</button>
</div>
<div id="report"></div>
<div class="foot">本报告由 AI 省钱器生成 · 数据源 sub2api 真实网关价 · Made by 一个赛博木匠</div>
</div>

<script>
var PRICES={"glm-5.3-flash":{n:"glm-5.3-flash",i:0.8,o:2.8,use:"最新超值，通用/多模态"},
 "deepseek-flash":{n:"deepseek-flash",i:2,o:8,use:"超值，通用对话/写文"},
 "glm-5.3":{n:"glm-5.3",i:8,o:28,use:"最新旗舰，复杂编程/Agent"},
 "deepseek-v4-pro":{n:"deepseek-v4-pro",i:9,o:27,use:"旗舰，复杂推理"},
 "qwen3.8-max":{n:"qwen3.8-max",i:14,o:42,use:"阿里旗舰，超长上下文"},
 "kimi-k3":{n:"kimi-k3",i:21,o:105,use:"月之暗面旗舰，长文"}};
var CODE="SAVER-ZH-2026"; // 付款后发放的解锁口令
// 实时价格: 拉 data.json(价格雷达齿轮每日更新)
fetch('data.json').then(function(r){return r.json()}).then(function(d){
  if(d&&d.models&&d.models.length){
    var p={};
    d.models.filter(function(m){return m.in!=null}).forEach(function(m){p[m.name]={n:m.name,i:m.in,o:m.out,use:m.provider+(String(m.src).indexOf('实时')>-1?' · 实时价':'')}});
    PRICES=p;
    var el=document.getElementById('app');
    if(el&&!el.classList.contains('hide'))render();
  }
}).catch(function(){});
function fmt(n){return n>=10000?(n/10000).toFixed(1)+"万":n.toFixed(2)}
function unlock(){
  if(document.getElementById('code').value.trim().toUpperCase()===CODE){document.getElementById('paywall').classList.add('hide');document.getElementById('app').classList.remove('hide');render();}
  else{alert('口令不对。付款后点"我已付款，显示口令"即可看到口令。');}
}
function paid(){document.getElementById('codereveal').classList.remove('hide');}
function previewMode(){document.getElementById('paywall').classList.add('hide');document.getElementById('app').classList.remove('hide');render(true);}
function render(preview){
  var inp=parseFloat(document.getElementById('in').value)||0,out=parseFloat(document.getElementById('out').value)||0;
  var b=document.getElementById('base').value.split(',').map(Number),use=document.getElementById('use').value;
  var cur=inp*b[0]+out*b[1];
  var rows=[];for(var k in PRICES){var p=PRICES[k];rows.push({k:k,n:p.n,c:inp*p.i+out*p.o,u:p.use});}
  rows.sort(function(a,b){return a.c-b.c});
  var best=rows[0];
  var save=cur-best.c,pct=cur>0?Math.round(save/cur*100):0;
  // 路由: 按用途选主力
  var route={"write":"deepseek-flash","agent":"glm-5.3","long":"qwen3.8-max","chat":"glm-5.3-flash"}[use];
  var rp=PRICES[route],rCost=inp*rp.i+out*rp.o;
  var cacheSave=cur*0.25, mixSave=cur*0.35;
  var h="";
  h+="<h2>一、你的成本画像</h2><div class='card'>";
  h+="<div>当前基准月成本 <span class='warn' style='font-size:1.2em;font-weight:700'>¥"+fmt(cur)+"</span> （输入 "+(inp)+"M / 输出 "+(out)+"M tokens）</div>";
  h+="<div class='big'>全部换国产最高省 ¥"+fmt(save)+" <small style='font-size:.5em;color:var(--mut)'>（省 "+pct+"%）</small></div></div>";
  h+="<h2>二、全模型成本对比</h2><table><tr><th>模型</th><th>定位</th><th>月成本</th><th>省</th></tr>";
  rows.forEach(function(r){h+="<tr><td>"+r.n+"</td><td>"+r.u+"</td><td>¥"+fmt(r.c)+"</td><td class='"+(r===best?'good':'')+"'>¥"+fmt(cur-r.c)+"</td></tr>";});
  h+="</table>";
  if(preview){h+="<div class='card' style='border-color:var(--or)'><b style='color:var(--or)'>🔒 以下为付费部分（¥9）</b><br>分场景路由方案 · 5条节省策略 · 12个月预测 · 迁移清单 · 中文生态选型表</div>";}
  else{
    h+="<h2>三、分场景路由方案<span class='tag'>按用途：你选的是"+use+"</span></h2><div class='card'>";
    h+="<div>推荐主力：<b class='good'>"+rp.n+"</b> —— "+rp.use+"</div>";
    h+="<div>该方案月成本 ¥"+fmt(rCost)+"，比你现在省 ¥"+fmt(cur-rCost)+"（省 "+(cur>0?Math.round((cur-rCost)/cur*100):0)+"%）</div>";
    h+="<div style='color:var(--mut);font-size:.88em;margin-top:8px'>混合路由：简单任务走 glm-5.3-flash（¥0.8/M），复杂任务才上 glm-5.3 / deepseek-v4-pro（¥8-9/M）。按 70/20/10 分流，可再降 20-30%。</div></div>";
    h+="<h2>四、5 条节省策略（带预估）</h2><ol>";
    h+="<li><b>提示词缓存</b>：把 system prompt / 长上下文缓存复用，输入费降 <b>25%</b>（≈省 ¥"+fmt(cacheSave)+"/月）。国产网关多支持 prompt cache。</li>";
    h+="<li><b>混合路由</b>：按任务难度分流到不同价位模型，整体降 <b>35%</b>（≈省 ¥"+fmt(mixSave)+"/月）。</li>";
    h+="<li><b>输出压缩</b>：限制 max_tokens + 结构化输出（JSON），输出费（单价最贵的部分）降 30%。</li>";
    h+="<li><b>批处理</b>：非实时任务合并成批，摊薄请求开销。</li>";
    h+="<li><b>本地小模型兜底</b>：分类/抽取类任务上本地 7B，0 API 成本。</li></ol>";
    h+="<h2>五、12 个月成本预测</h2><table><tr><th>方案</th><th>月成本</th><th>12个月</th></tr>";
    h+="<tr><td>现状("+document.getElementById('base').selectedOptions[0].text+")</td><td>¥"+fmt(cur)+"</td><td>¥"+fmt(cur*12)+"</td></tr>";
    h+="<tr><td>全换国产最优</td><td>¥"+fmt(best.c)+"</td><td>¥"+fmt(best.c*12)+"</td></tr>";
    var opt=best.c*0.65;
    h+="<tr><td class='good'>+缓存/路由优化</td><td class='good'>¥"+fmt(opt)+"</td><td class='good'>¥"+fmt(opt*12)+"</td></tr>";
    h+="</table><div class='card'>12个月累计可省 <b class='big'>¥"+fmt(cur*12-opt*12)+"</b></div>";
    h+="<h2>六、迁移清单</h2><ol><li>注册国产模型 API（智谱/DeepSeek/Moonshot），拿到 key</li><li>用 OpenAI 兼容网关统一接入（如 sub2api），一个 key 调所有模型</li><li>按上方路由表配置模型映射</li><li>开启 prompt cache，长 system prompt 打缓存标记</li><li>灰度：先切 20% 流量，对比质量与延迟</li><li>全量切换 + 用本工具每月复算一次</li></ol>";
    h+="<h2>七、中文生态选型表</h2><table><tr><th>场景</th><th>首选</th><th>理由</th></tr><tr><td>通用/写文</td><td>glm-5.3-flash</td><td>最新超值 ¥0.8/2.8</td></tr><tr><td>复杂编程/Agent</td><td>glm-5.3</td><td>最新旗舰，编程+50%</td></tr><tr><td>复杂推理</td><td>deepseek-v4-pro</td><td>推理链强</td></tr><tr><td>超长文档</td><td>qwen3.8-max</td><td>长上下文</td></tr></table>";
  }
  document.getElementById('report').innerHTML=h;
}
if(location.search.indexOf('k=')>-1){var m=location.search.match(/k=([^&]+)/);if(m&&decodeURIComponent(m[1]).toUpperCase()===CODE){document.getElementById('paywall').classList.add('hide');document.getElementById('app').classList.remove('hide');render();}}
</script>
</body>
</html>
